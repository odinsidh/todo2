services:
  db:
    image: postgres:14.24-alpine3.23
    container_name: db
    profiles: [core]

    networks: [isolated]
    volumes:
    - db-volume:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  adminer:
    image: adminer:6.0.1-standalone
    container_name: adminer
    profiles: [core]

    depends_on:
      db:
        condition: service_healthy

    networks: [isolated]
    restart: always

  socat:
    image: alpine/socat:1.8.1.3
    container_name: adminer-socat
    profiles: [watcher]

    ports:
      - 4321:1234
    command: tcp-listen:1234,fork,reuseaddr tcp-connect:adminer:8080

    networks: [isolated]
    restart: always


  cache:
    image: redis:8.8.1-trixie 
    container_name: cache
    profiles: [core]

    networks: [isolated]
    volumes:
      - cache-volume:/data
    command: redis-server --requirepass ${CACHE_PASSWORD} --appendonly yes

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CACHE_PASSWORD\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    restart: unless-stopped


  # app:
  #   networks: [isolated]
  #   profiles: [core]

  # goose:
  #   networks: [isolated]
  #   profiles: [migration]

networks:
  isolated:
    driver: bridge

volumes:
  cache-volume:
  db-volume:
  app-volume: